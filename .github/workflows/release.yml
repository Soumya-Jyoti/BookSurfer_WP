# Release packaging.
#
# BSWP-42. Cuts a distributable plugin .zip and attaches it to a GitHub Release.
# Fires when a v* tag is pushed. The tag is expected to be cut from an already-green
# main (CI + branch protection are the merge gate — see ci.yml); this workflow builds
# fresh from the tagged tree and publishes the artifact.
#
# The zip is produced by `wp-scripts plugin-zip` (npm run plugin-zip), which names it
# after the package.json "name" field -> book-surfer.zip.
#
# NOTE: without a .distignore or a package.json "files" field, plugin-zip falls back to
# its default include set. Verify the produced zip excludes node_modules/, vendor/,
# src/, tests/, stub/ and dotfiles before shipping to WordPress.org.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Package plugin zip
        run: npm run plugin-zip

      - name: Create GitHub Release and attach zip
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: book-surfer.zip
