# Release packaging.
#
# BSWP-42. Cuts a distributable plugin .zip and attaches it to a GitHub Release.
# Fires when a v* tag is pushed. The tag is expected to be cut from an already-green
# main (CI + branch protection are the merge gate — see ci.yml); this workflow builds
# fresh from the tagged tree and publishes the artifact.
#
# The zip is produced by `wp-scripts plugin-zip` (npm run plugin-zip), which names it
# after the package.json "name" field -> book-surfer.zip.
#
# The two publish paths select files by DIFFERENT mechanisms and must be kept in sync
# by hand — see the header of .distignore for the full explanation and the agreed
# payload. In short: plugin-zip ignores .distignore and uses a hardcoded allowlist;
# the 10up deploy action below reads .distignore as an exclude list.
#
# The WordPress.org job is gated on the WPORG_SLUG variable being set. Until the plugin
# is approved and a slug is assigned, it is skipped and only the GitHub Release is cut.
# To enable it, set repository variable WPORG_SLUG and secrets SVN_USERNAME/SVN_PASSWORD.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Package plugin zip
        run: npm run plugin-zip

      - name: Create GitHub Release and attach zip
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: book-surfer.zip

      # Publishes to WordPress.org SVN: commits to trunk, then creates tags/<version>
      # from the readme.txt "Stable tag" value. Skipped until WPORG_SLUG is set.
      - name: Deploy to WordPress.org
        if: vars.WPORG_SLUG != ''
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ vars.WPORG_SLUG }}
          ASSETS_DIR: .wordpress-org
